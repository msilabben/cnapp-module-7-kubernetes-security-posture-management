# ============================================================================
#  GATEWAY + HTTPROUTE - a layer 7 router in front of the shop Service
# ============================================================================
#  Two objects, and a third (a LoadBalancer Service backing this Gateway)
#  appears on its own - that's the point of this step. Requires the Istio
#  add-on and the Gateway API CRDs, see scripts/enable-gateway-api.sh.
#
#  kubectl apply -f manifests/north-south/shop-gateway.yaml
# ============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-gateway
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: shop-gateway
  hostnames: ["shop.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shop
          port: 80
