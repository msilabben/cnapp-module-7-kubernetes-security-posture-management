# Blocks ALL incoming traffic to every pod in this namespace, including your
# own frontend talking to your own database. An empty podSelector matches
# every pod; an empty (missing) ingress list means nothing is allowed in.
#
# kubectl apply -f manifests/east-west/netpol-default-deny-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
